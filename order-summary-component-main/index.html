<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Order summary card</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
<img class="bgPattern" src="./images/pattern-background-desktop.svg" alt="background pattern">
<img class="bgPattern bgPattern--mobile" src="./images/pattern-background-mobile.svg" alt="background pattern">
  <main>
    <div class="card">
      <div class="card__img"><img src="./images/illustration-hero.svg" alt="image of happy, drawn woman with headphones and phone on blue background"></div>
      <div class="card__body">
        <h1 class="card__title">Order Summary</h1>
        <p class="card__text">You can now listen to millions of songs, audiobooks, and podcasts on any 
          device anywhere you like!</p>
          <div class="card__plan">
            <img src="./images/icon-music.svg" alt="tone icon">
            <div class="card__plan--info">
              <h2>Annual Plan</h2>
              <p>$59.99/year</p>
            </div>
            <a href="#">Change</a>
          </div>
          <div class="card__btns">
            <button class="card__btn card__btn--highlight">Proceed to Payment</button>
            <a href="#">Cancel Order</a>
          </div>
      </div>
    </div>
  </main>




 
  


  
  
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/TomekWojak">Tomek</a>.
  </div>
</body>
</html>
